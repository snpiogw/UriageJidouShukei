<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | 売上集計</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card">
  <p class="eyebrow">Sales Aggregation</p>
  <h1>管理者ログイン</h1>
  <p class="muted">売上データの集計と自動実行設定を管理します。</p>
  <div class="alert error" th:if="${param.error}">ユーザー名またはパスワードが正しくありません。</div>
  <div class="alert success" th:if="${param.logout}">ログアウトしました。</div>
  <form th:action="@{/login}" method="post" class="stack">
    <label>ユーザー名<input name="username" autocomplete="username" required autofocus></label>
    <label>パスワード<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">ログイン</button>
  </form>
</main>
</body>
</html>
